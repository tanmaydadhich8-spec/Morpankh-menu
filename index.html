<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; margin-bottom: 100px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        .service-box { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #d4af37; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 10px; margin: 5px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .main-category { background: #d4af37; color: #000; padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .category-content { display: none; padding: 10px; background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; }
        .food-card { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; }
        .add-btn { background: #d4af37; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #d4af37; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header">
    <h2>MORPANKH CAFE & RESTRO</h2>
    <p style="font-size: 14px;">Owner: Kishan Asopa | 7014808515, 9928427598<br>Napasar, 334201</p>
</div>

<div class="service-box">
    <input type="text" id="custName" class="input-field" placeholder="अपना नाम लिखें">
    <label><input type="radio" name="type" onclick="document.getElementById('dine').style.display='block'; document.getElementById('del').style.display='none';" checked> टेबल पर खाना</label>
    <label style="margin-left:10px;"><input type="radio" name="type" onclick="document.getElementById('dine').style.display='none'; document.getElementById('del').style.display='block';"> होम डिलीवरी</label>
    <input type="text" id="dine" class="input-field" placeholder="टेबल नंबर लिखें">
    <input type="text" id="del" class="input-field" placeholder="अपना पूरा पता लिखें" style="display:none">
</div>

<div id="menu-container"></div>

<div class="cart-bar">
    <div>कुल बिल: ₹<span id="total">0</span></div>
    <button class="add-btn" onclick="order()">ऑर्डर भेजें</button>
</div>

<script>
    const menu = {
        "🍕 पिज्जा": {"Veg Pizza": 170, "Onion Pizza": 150, "Paneer Cheese Pizza": 230, "Onion Capsicum Pizza": 200, "Baby Corn Pizza": 210, "Masala Pizza": 200, "Tomato Pizza": 190, "Morpankh Pizza": 350, "Extra Cheese": 70},
        "🍔 बर्गर": {"Veg Burger": 50, "Paneer Cheese Burger": 100, "Cheese Burger": 80, "Masala Burger": 70, "Double Tikki Burger": 150},
        "🥪 सैंडविच": {"Veg Sandwich": 100, "Cheese Sandwich": 120, "Paneer Cheese Sandwich": 140, "Chocolate Sandwich": 150, "Masala Sandwich": 100, "Paneer Masala Cheese Sandwich": 180, "Pizza Sandwich": 180},
        "🍟 फ्रेंच फ्राई": {"French Fries (Full)": 80, "French Fries (Half)": 60, "Masala French Fries (Full)": 120, "Masala French Fries (Half)": 80},
        "🍞 पावभाजी": {"Masala Pav Bhaji": 100, "Pav Bhaji": 80, "Extra Pav": 20, "Extra Bhaji": 30},
        "🍜 चाऊमीन": {"Veg Chowmein": 60, "Garlic Chowmein": 80, "Schezwan Chowmein": 90, "Paneer Chowmein": 100, "Chowmein Manchurian": 100, "Morpankh Chowmein": 150},
        "🧆 मन्चुरियन": {"Dry Manchurian": 90, "Gravy Manchurian": 110, "Paneer Manchurian": 150, "Manchurian Chowmein": 100},
        "🥞 डोसा": {"Masala Dosa": 100, "Plain Dosa": 80, "Paneer Masala Dosa": 130, "Cheese Masala Dosa": 140, "Pizza Dosa": 200, "Sargam Dosa": 250, "Morpankh Dosa": 399},
        "🥞 रोल": {"Veg Roll": 100, "Franky Roll": 120},
        "🥞 मोमोज": {"Steam Momos": 100, "Fried Momos": 120},
        "🥞 कुरकुरे मसाला चाट": {"Kurkure Masala Chaat": 49},
       "🥞 लेज़ कॉकटेल भेल": {"Lays Cocktail Bhel": 79},
        "🥞 चिप्स मसाला कुरकुरे चाट": {"Chips Masala Kurkure Chaat": 89},

        
    
    

    };

    const container = document.getElementById('menu-container');
    let cart = {}, total = 0;

    for (let cat in menu) {
        container.innerHTML += `<div class="main-category" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='block'?'none':'block'">${cat} <span>▼</span></div><div class="category-content" id="${cat}"></div>`;
        for (let item in menu[cat]) {
            document.getElementById(cat).innerHTML += `<div class="food-card">${item} <span>₹${menu[cat][item]}</span> <button class="add-btn" onclick="add('${item}', ${menu[cat][item]})">Add</button></div>`;
        }
    }

    function add(n, p) { cart[n] = (cart[n]||0)+1; total += p; document.getElementById('total').innerText = total; }
    function order() { 
        let name = document.getElementById('custName').value;
        if(!name) { alert("अपना नाम लिखें!"); return; }
        let type = document.querySelector('input[name="type"]:checked').nextSibling.textContent.trim();
        let details = type === 'टेबल पर खाना' ? document.getElementById('dine').value : document.getElementById('del').value;
        let msg = `*ORDER - Morpankh Cafe & Restro*%0A--------------------------%0A👤 *Name:* ${name}%0A📍 *Type:* ${type}%0A🏠 *Details:* ${details}%0A--------------------------%0A`;
        for(let i in cart) msg += `${i} x ${cart[i]}%0A`;
        msg += `--------------------------%0A💰 *Total Bill:* ₹${total}`;
        window.open("https://wa.me/917014808515?text=" + msg);
    }
</script>
</body>
</html>

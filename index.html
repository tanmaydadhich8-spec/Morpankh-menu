<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #121212; color: #f4f4f4; padding-bottom: 140px; }
        header { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); padding: 30px 20px; text-align: center; border-bottom: 3px solid #d4af37; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo { font-size: 45px; margin-bottom: 5px; filter: drop-shadow(0px 0px 8px #d4af37); }
        header h1 { font-family: 'Cinzel', serif; font-size: 26px; color: #d4af37; letter-spacing: 2px; margin-bottom: 8px; }
        .owner-info { font-size: 13px; color: #ccc; line-height: 1.6; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        .service-box { background: #1e1e1e; padding: 20px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #d4af37; }
        .input-field { width: 100%; padding: 11px; background: #252525; border: 1px solid #444; border-radius: 8px; color: #fff; margin-top: 10px; }
        .main-category { background: #d4af37; color: #000; font-weight: bold; padding: 14px; margin: 12px 0; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; }
        .category-content { display: none; }
        .food-card { background: #1e1e1e; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .add-btn { background: #d4af37; color: #000; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .cart-bar { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: #1a1a1a; padding: 15px; border-top: 2px solid #d4af37; z-index: 1000; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🦚</div>
        <h1>Morpankh Cafe & Restro</h1>
        <div class="owner-info">
            👤 Owner: Kishan Asopa<br>
            📞 7014808515, 9928427598<br>
            📍 Napasar 334201
        </div>
    </header>

    <div class="container">
        <div class="service-box">
            <input type="text" id="custName" class="input-field" placeholder="अपना नाम लिखें">
            <input type="text" id="address" class="input-field" placeholder="पता या टेबल नंबर">
            <div style="margin-top:10px; color:#d4af37; font-size:12px;">Payment Mode: <input type="radio" name="pay" value="Cash" checked> Cash <input type="radio" name="pay" value="Online"> Online</div>
        </div>

        <div class="main-category" onclick="toggle(this)">🍕 PIZZA</div>
        <div class="category-content">
            <div class="food-card">Veg Pizza - ₹170 <button class="add-btn" onclick="add('Veg Pizza', 170)">Add</button></div>
            <div class="food-card">Onion Pizza - ₹150 <button class="add-btn" onclick="add('Onion Pizza', 150)">Add</button></div>
        </div>
        
        <div class="main-category" onclick="toggle(this)">🍔 BURGER</div>
        <div class="category-content">
            <div class="food-card">Veg Burger - ₹50 <button class="add-btn" onclick="add('Veg Burger', 50)">Add</button></div>
            <div class="food-card">Cheese Burger - ₹80 <button class="add-btn" onclick="add('Cheese Burger', 80)">Add</button></div>
        </div>
    </div>

    <div class="cart-bar">
        <div>Bill: ₹<span id="total">0</span></div>
        <button class="add-btn" style="width:100%; margin-top:10px;" onclick="order()">Place Order</button>
    </div>

    <script>
        let cart = {}, total = 0;
        function toggle(el) { el.nextElementSibling.style.display = (el.nextElementSibling.style.display === 'block') ? 'none' : 'block'; }
        function add(n, p) { if(!cart[n]) cart[n] = 0; cart[n]++; total += p; document.getElementById('total').innerText = total; }
        function order() { 
            let name = document.getElementById('custName').value;
            if(!name || total == 0) { alert("Naam aur item fill karein!"); return; }
            let msg = `Order: ${JSON.stringify(cart)} \nTotal: ₹${total} \nName: ${name} \nDetails: ${document.getElementById('address').value}`;
            let link = "https://wa.me/917014808515?text=" + encodeURIComponent(msg);
            document.body.innerHTML += `<div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <h2 style="color:#d4af37;">Order Accepted!</h2>
                <a href="${link}" style="background:#25d366; color:white; padding:20px; border-radius:10px; text-decoration:none;">WhatsApp par bhejein</a>
                <button onclick="location.reload()" style="margin-top:20px;">Refresh</button>
            </div>`;
        }
    </script>
</body>
</html>
